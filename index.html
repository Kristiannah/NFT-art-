<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <h2>Register</h2>
  <form id="registerForm">
    <input type="email" id="registerEmail" placeholder="Email" required>
    <input type="password" id="registerPassword" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 🔑 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDX5l-iBZLWspb6bOlQSMvm7PnP2MYBs5o",
      authDomain: "artmintx.firebaseapp.com",
      projectId: "artmintx",
      storageBucket: "artmintx.firebasestorage.app",
      messagingSenderId: "209020671049",
      appId: "1:209020671049:web:df8f1f8b986a747ba1db98"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ✅ Check if already logged in → redirect
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "admin.html"; // redirect to dashboard
      }
    });

    // ✅ Login
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("Login successful 🎉");
          window.location.href = "admin.html"; 
        })
        .catch((error) => {
          alert(error.message);
        });
    });

    // ✅ Register
    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("Registration successful 🎉 Now logged in");
          window.location.href = "admin.html"; 
        })
        .catch((error) => {
          alert(error.message);
        });
    });
  </script>
</body>
</html>
